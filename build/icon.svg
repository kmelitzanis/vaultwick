<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#34e0b0"/>
      <stop offset="1" stop-color="#16a875"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0a6b4a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#sheen)"/>

  <!-- Network drive on a LAN (same glyph as the in-app logo, 120-unit grid) -->
  <g filter="url(#shadow)" transform="translate(192 176) scale(5.3333)">
    <!-- drive enclosure with two bays -->
    <rect x="22" y="20" width="76" height="42" rx="10" fill="#ffffff"/>
    <rect x="32" y="30" width="38" height="6" rx="3" fill="#16a875" opacity="0.35"/>
    <rect x="32" y="46" width="38" height="6" rx="3" fill="#16a875" opacity="0.35"/>
    <!-- network links -->
    <path d="M60 62v3M32 86v-8a2 2 0 0 1 2-2h52a2 2 0 0 1 2 2v8"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- padlock at the junction: the share is protected -->
    <path d="M55 75v-4.5a5 5 0 0 1 10 0v4.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="50.5" y="73.5" width="19" height="16" rx="4" fill="#ffffff"/>
    <circle cx="60" cy="80" r="2.3" fill="#16a875"/>
    <rect x="59" y="80.5" width="2" height="5" rx="1" fill="#16a875"/>
    <!-- client computers -->
    <rect x="18" y="86" width="28" height="18" rx="5" fill="#ffffff"/>
    <rect x="74" y="86" width="28" height="18" rx="5" fill="#ffffff"/>
  </g>
  <!-- activity LEDs -->
  <g transform="translate(192 176) scale(5.3333)">
    <circle cx="84" cy="33" r="4" fill="#22c47a"/>
    <circle cx="84" cy="49" r="4" fill="#22c47a"/>
  </g>
</svg>
