name: Release

# Releases whenever the version in package.json changes on main (or on demand).
# 1. Reads the version and its CHANGELOG.md section (fails if there is none).
# 2. Creates the vX.Y.Z tag and a draft GitHub Release with those notes.
# 3. Builds and uploads installers for macOS, Windows and Linux.
# 4. Publishes the release once every build has succeeded.

on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        name: Read version and check for an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "Release $TAG is already published — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # "none": first run. "true": an earlier run failed mid-way; retry the builds.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "existing=$DRAFT" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.meta.outputs.release == 'true'
        run: node scripts/changelog.js "${{ steps.meta.outputs.version }}" > release-notes.md

      - name: Create tag and draft release
        if: steps.meta.outputs.release == 'true' && steps.meta.outputs.existing == 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${{ steps.meta.outputs.tag }}" >/dev/null; then
            git tag "${{ steps.meta.outputs.tag }}" "$GITHUB_SHA"
            git push origin "${{ steps.meta.outputs.tag }}"
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --draft \
            --title "Vaultwick ${{ steps.meta.outputs.version }}" \
            --verify-tag \
            --notes-file release-notes.md

      - name: Refresh notes of an existing draft
        if: steps.meta.outputs.release == 'true' && steps.meta.outputs.existing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.meta.outputs.tag }}" --notes-file release-notes.md

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Uploads installers into the draft release created above. Signing and
      # notarization run only when the matching secrets are configured.
      - name: Build and upload installers
        shell: bash
        run: |
          # Unset secrets that are not configured: electron-builder treats an
          # empty CSC_LINK as a path and fails with "not a file".
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$APPLE_ID" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Build without uploading, rename the Intel files from "x64" to
            # "amd64" (and fix latest-mac.yml), then upload them ourselves.
            npx electron-builder --mac --publish never
            node scripts/rename-mac-artifacts.js dist
            gh release upload "$TAG" --clobber \
              dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml
          else
            npx electron-builder --publish always
          fi
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
